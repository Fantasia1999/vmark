name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Smoke render
        run: npm run smoke

      - name: Syntax-check ssh-bridge
        run: |
          node --check ssh-bridge/server.mjs
          node --check ssh-bridge/wsl.mjs

      - name: Upload extension bundle
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: vscode-md-preview-dist
          path: dist/
          if-no-files-found: error
