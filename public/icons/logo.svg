<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="VS Code Markdown Preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a9fff"/>
      <stop offset="55%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
    <linearGradient id="docShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#003d6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="56" rx="28" fill="#ffffff" opacity="0.08"/>

  <!-- Document -->
  <g filter="url(#softShadow)">
    <path d="M36 22h42l18 18v62a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8V30a8 8 0 0 1 8-8z" fill="url(#docShine)"/>
    <path d="M78 22v14a4 4 0 0 0 4 4h14" fill="#d7e3f0"/>
    <path d="M78 22l18 18H82a4 4 0 0 1-4-4V22z" fill="#c5d4e4"/>

    <!-- Text lines (markdown body) -->
    <rect x="42" y="52" width="44" height="7" rx="3.5" fill="#007ACC"/>
    <rect x="42" y="64" width="36" height="6" rx="3" fill="#8a96a3"/>
    <rect x="42" y="75" width="28" height="6" rx="3" fill="#8a96a3"/>

    <!-- Stylized M (markdown mark) -->
    <path d="M44 102 V84 L56 96 L64 86 L72 96 L84 84 V102"
          fill="none" stroke="#007ACC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

