  <circle cx="98" cy="98" r="18" fill="#ffffff"/>
  <circle cx="98" cy="98" r="15" fill="#37A3F8"/>
  <ellipse cx="98" cy="98" rx="8" ry="5.5" fill="#ffffff"/>
  <circle cx="98" cy="98" r="3.2" fill="#005a9e"/>
</svg>
