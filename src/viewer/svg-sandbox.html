<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Preview Sandbox</title>
    <style>
      /*
       * No internal scrolling. Tall SVGs expand this document; the parent
       * workbench pane scrolls. Avoids Chrome iframe scroll-reset when the
       * pointer leaves the frame.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: auto;
        overflow: hidden;
        background: #fff;
      }
      body > svg {
        display: block;
        max-width: none;
      }
    </style>
  </head>
  <body>
    <script>
      /**
       * Extension sandbox page (relaxed CSP: inline + eval).
       * Hosts interactive SVGs (FlameGraph click-zoom / search).
       */
      (function () {
        'use strict';

        var lastContentKey = '';
        var resizeObserver = null;

        /** Patch history so FlameGraph URL state updates never throw. */
        function patchHistory() {
          try {
            var origReplace = history.replaceState.bind(history);
            history.replaceState = function (state, title, url) {
              try {
                return origReplace(state, title, url);
              } catch (_e) {
                /* ignore */
              }
            };
            var origPush = history.pushState.bind(history);
            history.pushState = function (state, title, url) {
              try {
                return origPush(state, title, url);
              } catch (_e) {
                /* ignore */
              }
            };
          } catch (_e) {
            /* ignore */
          }
        }

        function contentKey(content) {
          // Cheap identity: length + edges (full hash unnecessary)
          if (typeof content !== 'string') return '';
          var n = content.length;
          return n + ':' + content.slice(0, 64) + ':' + content.slice(Math.max(0, n - 64));
        }

        function extractScripts(svgEl) {
          var scripts = [];
          var nodes = svgEl.querySelectorAll('script');
          for (var i = 0; i < nodes.length; i++) {
            var s = nodes[i];
            var text = s.textContent || '';
            text = text.replace(/^\s*<!\[CDATA\[/, '').replace(/\]\]>\s*$/, '');
            scripts.push(text);
            s.parentNode.removeChild(s);
          }
          return scripts;
        }

        function injectClassicScripts(list) {
          for (var i = 0; i < list.length; i++) {
            var code = list[i];
            if (!code || !String(code).trim()) continue;
            var el = document.createElement('script');
            el.type = 'text/javascript';
            el.text = code;
            document.body.appendChild(el);
          }
        }

        function callInit(svgEl) {
          if (typeof window.init === 'function') {
            try {
              window.init({ target: svgEl, type: 'load' });
            } catch (err) {
              console.error('[svg-sandbox] init() failed', err);
            }
          }
        }

        function measureHeight() {
          var svg = document.querySelector('body > svg');
          var h = 0;
          if (svg) {
            var rect = svg.getBoundingClientRect();
            var attrH = parseFloat(svg.getAttribute('height') || '');
            var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
            var vbH = vb.length === 4 && Number.isFinite(vb[3]) ? vb[3] : 0;
            h = Math.max(rect.height || 0, svg.scrollHeight || 0, attrH || 0, vbH || 0);
          }
          h = Math.max(
            h,
            document.documentElement.scrollHeight || 0,
            document.body.scrollHeight || 0,
          );
          // Floor so short icons still show; cap absurd values
          if (!Number.isFinite(h) || h < 1) h = 200;
          return Math.ceil(h);
        }

        function reportSize() {
          try {
            parent.postMessage(
              { type: 'svg-sandbox-size', height: measureHeight() },
              '*',
            );
          } catch (_e) {
            /* ignore */
          }
        }

        function watchSize(svgEl) {
          if (resizeObserver) {
            try {
              resizeObserver.disconnect();
            } catch (_e) {
              /* ignore */
            }
            resizeObserver = null;
          }
          if (typeof ResizeObserver === 'function' && svgEl) {
            resizeObserver = new ResizeObserver(function () {
              reportSize();
            });
            resizeObserver.observe(svgEl);
          }
          // FlameGraph zoom mutates attributes — remeasure after click
          window.addEventListener(
            'click',
            function () {
              requestAnimationFrame(function () {
                requestAnimationFrame(reportSize);
              });
            },
            true,
          );
        }

        function loadSvg(content) {
          if (typeof content !== 'string' || !content.trim()) {
            document.body.textContent = 'Empty SVG';
            reportSize();
            return;
          }

          var key = contentKey(content);
          // Ignore duplicate posts (ready + load fallback) so we don't wipe scroll state
          if (key && key === lastContentKey && document.querySelector('body > svg')) {
            reportSize();
            return;
          }
          lastContentKey = key;

          patchHistory();
          document.body.replaceChildren();

          var parser = new DOMParser();
          var doc = parser.parseFromString(content, 'image/svg+xml');
          var parseErr = doc.querySelector('parsererror');
          if (parseErr) {
            document.body.textContent =
              'Invalid SVG: ' + (parseErr.textContent || 'parse error');
            reportSize();
            return;
          }

          var svg = doc.documentElement;
          if (!svg || svg.tagName.toLowerCase() !== 'svg') {
            document.body.textContent = 'Not an SVG document';
            reportSize();
            return;
          }

          var onloadAttr = svg.getAttribute('onload') || svg.getAttribute('onLoad') || '';
          svg.removeAttribute('onload');
          svg.removeAttribute('onLoad');

          var scripts = extractScripts(svg);
          var imported = document.importNode(svg, true);
          document.body.appendChild(imported);

          injectClassicScripts(scripts);

          if (onloadAttr && /init\s*\(/.test(onloadAttr)) {
            callInit(imported);
          } else if (onloadAttr) {
            try {
              var fn = new Function('evt', onloadAttr);
              fn({ target: imported, type: 'load' });
            } catch (err) {
              console.error('[svg-sandbox] onload failed', err);
              callInit(imported);
            }
          } else {
            callInit(imported);
          }

          watchSize(imported);
          // Layout may settle after fonts / script init
          reportSize();
          requestAnimationFrame(function () {
            reportSize();
            requestAnimationFrame(reportSize);
          });
          setTimeout(reportSize, 100);
          setTimeout(reportSize, 400);
        }

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (!data || data.type !== 'load-svg') return;
          loadSvg(data.content);
        });

        /*
         * Forward wheel to the parent scroll container. The iframe document
         * itself does not scroll; without this, wheel over the SVG does nothing
         * (or fights nested scroll and resets).
         */
        window.addEventListener(
          'wheel',
          function (e) {
            try {
              parent.postMessage(
                {
                  type: 'svg-sandbox-wheel',
                  deltaX: e.deltaX,
                  deltaY: e.deltaY,
                  deltaZ: e.deltaZ,
                  deltaMode: e.deltaMode,
                },
                '*',
              );
            } catch (_err) {
              /* ignore */
            }
            e.preventDefault();
          },
          { passive: false },
        );

        try {
          parent.postMessage({ type: 'svg-sandbox-ready' }, '*');
        } catch (_e) {
          /* ignore */
        }
      })();
    </script>
  </body>
</html>
