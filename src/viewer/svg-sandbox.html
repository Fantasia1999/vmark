<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Preview Sandbox</title>
    <style>
      /*
       * No internal scrolling. Tall SVGs expand this document; the parent
       * workbench pane scrolls. Avoids Chrome iframe scroll-reset when the
       * pointer leaves the frame.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        /* Grow with wide flame graphs so the parent can show a horizontal scrollbar */
        width: max-content;
        min-width: 100%;
        height: auto;
        overflow: hidden;
        background: #fff;
      }
      body > svg {
        display: block;
        /* Do not set width/height here — presentation attrs + JS must control size.
         * `width: auto` would override width="1200" and collapse to iframe ~300. */
        max-width: none;
      }
    </style>
  </head>
  <body>
    <script>
      /**
       * Extension sandbox page (relaxed CSP: inline + eval).
       * Hosts interactive SVGs (FlameGraph click-zoom / search).
       */
      (function () {
        'use strict';

        var lastContentKey = '';
        var resizeObserver = null;

        /** Patch history so FlameGraph URL state updates never throw. */
        function patchHistory() {
          try {
            var origReplace = history.replaceState.bind(history);
            history.replaceState = function (state, title, url) {
              try {
                return origReplace(state, title, url);
              } catch (_e) {
                /* ignore */
              }
            };
            var origPush = history.pushState.bind(history);
            history.pushState = function (state, title, url) {
              try {
                return origPush(state, title, url);
              } catch (_e) {
                /* ignore */
              }
            };
          } catch (_e) {
            /* ignore */
          }
        }

        function contentKey(content) {
          // Cheap identity: length + edges (full hash unnecessary)
          if (typeof content !== 'string') return '';
          var n = content.length;
          return n + ':' + content.slice(0, 64) + ':' + content.slice(Math.max(0, n - 64));
        }

        function extractScripts(svgEl) {
          var scripts = [];
          var nodes = svgEl.querySelectorAll('script');
          for (var i = 0; i < nodes.length; i++) {
            var s = nodes[i];
            var text = s.textContent || '';
            text = text.replace(/^\s*<!\[CDATA\[/, '').replace(/\]\]>\s*$/, '');
            scripts.push(text);
            s.parentNode.removeChild(s);
          }
          return scripts;
        }

        function injectClassicScripts(list) {
          for (var i = 0; i < list.length; i++) {
            var code = list[i];
            if (!code || !String(code).trim()) continue;
            var el = document.createElement('script');
            el.type = 'text/javascript';
            el.text = code;
            document.body.appendChild(el);
          }
        }

        function callInit(svgEl) {
          if (typeof window.init === 'function') {
            try {
              window.init({ target: svgEl, type: 'load' });
            } catch (err) {
              console.error('[svg-sandbox] init() failed', err);
            }
          }
        }

        /**
         * FlameGraph / wide SVG default when width is missing or only "%".
         * Avoids HTML iframe intrinsic fallback (300×150).
         */
        var DEFAULT_SVG_WIDTH = 1200;

        function isPercentLength(raw) {
          return raw != null && raw !== '' && /%\s*$/.test(String(raw));
        }

        /** Absolute length only (px / unitless). Percent → 0 (cyclic vs iframe). */
        function parseSvgLength(raw) {
          if (raw == null || raw === '') return 0;
          if (isPercentLength(raw)) return 0;
          var n = parseFloat(String(raw).replace(/px$/i, ''));
          return Number.isFinite(n) && n > 0 ? n : 0;
        }

        function viewBoxSize(svg) {
          var vb = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
          return {
            w: vb.length === 4 && Number.isFinite(vb[2]) && vb[2] > 0 ? vb[2] : 0,
            h: vb.length === 4 && Number.isFinite(vb[3]) && vb[3] > 0 ? vb[3] : 0,
          };
        }

        /**
         * Prefer width attr (absolute) or viewBox width. No reliable width → 0.
         */
        function absoluteSvgWidth(svg) {
          var attrW = parseSvgLength(svg.getAttribute('width'));
          if (attrW > 0) return attrW;
          return viewBoxSize(svg).w;
        }

        function absoluteSvgHeight(svg) {
          var attrH = parseSvgLength(svg.getAttribute('height'));
          if (attrH > 0) return attrH;
          return viewBoxSize(svg).h;
        }

        /**
         * Materialize a real pixel width on the SVG so it actually paints wide.
         * - missing / width="100%" / only viewBox → use viewBox or DEFAULT 1200
         * - always set attribute + inline style (beats any stylesheet)
         * Returns the display width used.
         */
        function ensureSvgWidth(svg) {
          var rawW = svg.getAttribute('width');
          var absW = absoluteSvgWidth(svg);
          var w = absW > 0 ? absW : DEFAULT_SVG_WIDTH;

          // Replace missing or percentage width with absolute pixels
          if (!rawW || isPercentLength(rawW) || absW <= 0) {
            w = absW > 0 ? absW : DEFAULT_SVG_WIDTH;
            svg.setAttribute('width', String(w));
          } else {
            w = absW > 0 ? absW : DEFAULT_SVG_WIDTH;
          }

          // Inline style so display matches attribute (FlameGraph uses baseVal too)
          svg.style.setProperty('width', w + 'px');
          svg.style.setProperty('max-width', 'none');

          var rawH = svg.getAttribute('height');
          var absH = absoluteSvgHeight(svg);
          if (absH > 0) {
            if (!rawH || isPercentLength(rawH)) {
              svg.setAttribute('height', String(absH));
            }
            svg.style.setProperty('height', absH + 'px');
          }
          svg.style.setProperty('max-height', 'none');

          return w;
        }

        /** Content box of the SVG (width + height) for parent iframe sizing. */
        function measureSize() {
          var svg = document.querySelector('body > svg');
          var w = 0;
          var h = 0;
          if (svg) {
            var rect = svg.getBoundingClientRect();
            var attrW = parseSvgLength(svg.getAttribute('width'));
            var attrH = parseSvgLength(svg.getAttribute('height'));
            var vb = viewBoxSize(svg);
            // Prefer attribute/viewBox; do not let a collapsed layout rect win
            var absW = Math.max(attrW, vb.w);
            if (absW > 0) {
              w = Math.max(absW, svg.scrollWidth || 0);
              // rect only if it is not the iframe intrinsic collapse (~300)
              if ((rect.width || 0) >= absW * 0.9) {
                w = Math.max(w, rect.width);
              }
            } else {
              w = DEFAULT_SVG_WIDTH;
            }
            // Never report narrower than our display default when we pinned width
            if (w < DEFAULT_SVG_WIDTH && absW <= 0) {
              w = DEFAULT_SVG_WIDTH;
            }
            h = Math.max(
              rect.height || 0,
              svg.scrollHeight || 0,
              attrH || 0,
              vb.h || 0,
            );
          }
          w = Math.max(
            w,
            document.documentElement.scrollWidth || 0,
            document.body.scrollWidth || 0,
          );
          h = Math.max(
            h,
            document.documentElement.scrollHeight || 0,
            document.body.scrollHeight || 0,
          );
          if (!Number.isFinite(w) || w < 1) w = DEFAULT_SVG_WIDTH;
          if (!Number.isFinite(h) || h < 1) h = 200;
          return { width: Math.ceil(w), height: Math.ceil(h) };
        }

        function reportSize() {
          try {
            var size = measureSize();
            parent.postMessage(
              {
                type: 'svg-sandbox-size',
                width: size.width,
                height: size.height,
              },
              '*',
            );
          } catch (_e) {
            /* ignore */
          }
        }

        function watchSize(svgEl) {
          if (resizeObserver) {
            try {
              resizeObserver.disconnect();
            } catch (_e) {
              /* ignore */
            }
            resizeObserver = null;
          }
          if (typeof ResizeObserver === 'function' && svgEl) {
            resizeObserver = new ResizeObserver(function () {
              reportSize();
            });
            resizeObserver.observe(svgEl);
          }
          // FlameGraph zoom mutates attributes — remeasure after click
          window.addEventListener(
            'click',
            function () {
              requestAnimationFrame(function () {
                requestAnimationFrame(reportSize);
              });
            },
            true,
          );
        }

        function loadSvg(content) {
          if (typeof content !== 'string' || !content.trim()) {
            document.body.textContent = 'Empty SVG';
            reportSize();
            return;
          }

          var key = contentKey(content);
          // Ignore duplicate posts (ready + load fallback) so we don't wipe scroll state
          if (key && key === lastContentKey && document.querySelector('body > svg')) {
            reportSize();
            return;
          }
          lastContentKey = key;

          patchHistory();
          document.body.replaceChildren();

          var parser = new DOMParser();
          var doc = parser.parseFromString(content, 'image/svg+xml');
          var parseErr = doc.querySelector('parsererror');
          if (parseErr) {
            document.body.textContent =
              'Invalid SVG: ' + (parseErr.textContent || 'parse error');
            reportSize();
            return;
          }

          var svg = doc.documentElement;
          if (!svg || svg.tagName.toLowerCase() !== 'svg') {
            document.body.textContent = 'Not an SVG document';
            reportSize();
            return;
          }

          var onloadAttr = svg.getAttribute('onload') || svg.getAttribute('onLoad') || '';
          svg.removeAttribute('onload');
          svg.removeAttribute('onLoad');

          var scripts = extractScripts(svg);
          var imported = document.importNode(svg, true);
          // Missing / % width → absolute pixels (default 1200). Must run before
          // FlameGraph init() so svg.width.baseVal is the real display width.
          ensureSvgWidth(imported);
          document.body.appendChild(imported);

          injectClassicScripts(scripts);

          if (onloadAttr && /init\s*\(/.test(onloadAttr)) {
            callInit(imported);
          } else if (onloadAttr) {
            try {
              var fn = new Function('evt', onloadAttr);
              fn({ target: imported, type: 'load' });
            } catch (err) {
              console.error('[svg-sandbox] onload failed', err);
              callInit(imported);
            }
          } else {
            callInit(imported);
          }

          // Scripts may rewrite attrs; re-pin width after init
          ensureSvgWidth(imported);

          watchSize(imported);
          // Layout may settle after fonts / script init
          reportSize();
          requestAnimationFrame(function () {
            reportSize();
            requestAnimationFrame(reportSize);
          });
          setTimeout(reportSize, 100);
          setTimeout(reportSize, 400);
        }

        window.addEventListener('message', function (event) {
          // Only the embedding viewer may feed content; embedded SVG scripts
          // run here, so any other window must not be able to inject them.
          if (event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.type !== 'load-svg') return;
          loadSvg(data.content);
        });

        /*
         * Forward wheel to the parent scroll container. The iframe document
         * itself does not scroll; without this, wheel over the SVG does nothing
         * (or fights nested scroll and resets).
         */
        window.addEventListener(
          'wheel',
          function (e) {
            try {
              parent.postMessage(
                {
                  type: 'svg-sandbox-wheel',
                  deltaX: e.deltaX,
                  deltaY: e.deltaY,
                  deltaZ: e.deltaZ,
                  deltaMode: e.deltaMode,
                  shiftKey: !!e.shiftKey,
                  ctrlKey: !!e.ctrlKey,
                  metaKey: !!e.metaKey,
                },
                '*',
              );
            } catch (_err) {
              /* ignore */
            }
            e.preventDefault();
          },
          { passive: false },
        );

        try {
          parent.postMessage({ type: 'svg-sandbox-ready' }, '*');
        } catch (_e) {
          /* ignore */
        }
      })();
    </script>
  </body>
</html>
